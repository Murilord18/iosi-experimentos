# Robo IOSI, seg a sex:
#   manha      (09h17 BRT): so coleta (historico do pre-mercado), sem previsao
#   manha_1030 (10h30 BRT): coleta com a B3 aberta + previsao das 10h30 (predictor_1030.py)
#   noite      (19h00 BRT): coleta + validacao
# Manual com modo = carga_inicial: so envia ao Supabase o que ja esta em data/ (uma vez).
# Horarios em UTC: 12:17 UTC = 09:17 BRT, 13:30 UTC = 10:30 BRT e 22:00 UTC = 19:00 BRT
# (o GitHub pode atrasar alguns minutos; a previsao so usa candles com fim <= 10h30).
# O predictor_9h15.py nao roda mais no agendamento (o codigo continua em src/).
name: robo_iosi

on:
  schedule:
    - cron: '17 12 * * 1-5'   # manha (so coleta)
    - cron: '30 13 * * 1-5'   # manha_1030
    - cron: '0 22 * * 1-5'    # noite
  workflow_dispatch:
    inputs:
      modo:
        description: 'manha (so coleta 9h17), manha_1030 (coleta + previsao 10h30), noite (coleta + validacao) ou carga_inicial (data/ -> Supabase)'
        required: true
        default: noite
        type: choice
        options: [manha, manha_1030, noite, carga_inicial]

permissions:
  contents: write

concurrency:
  group: robo_iosi
  cancel-in-progress: false

jobs:
  robo:
    runs-on: ubuntu-24.04
    # o coletor das 10h30 pode esperar ate 25 min pelo candle do BOVA11 (atraso do Yahoo)
    timeout-minutes: 45
    env:
      MODO: ${{ github.event_name == 'workflow_dispatch' && inputs.modo || (github.event.schedule == '17 12 * * 1-5' && 'manha' || (github.event.schedule == '30 13 * * 1-5' && 'manha_1030' || 'noite')) }}
      # copia no Supabase; sem os secrets o robo so grava os CSVs
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Carga inicial no Supabase
        if: ${{ env.MODO == 'carga_inicial' }}
        run: python src/carga_inicial_supabase.py

      - name: Coleta (${{ env.MODO }})
        id: coleta
        if: ${{ env.MODO != 'carga_inicial' }}
        continue-on-error: true
        run: python src/coletor_snapshots.py "$MODO"

      # roda mesmo se a coleta falhar: o preditor busca os candles de 5m no Yahoo (fim <= 10h30)
      # e o validador grava "sem_candle_real". O modo manha (9h17) nao tem esta etapa.
      - name: Previsao ou validacao (${{ env.MODO }})
        id: etapa2
        if: ${{ !cancelled() && (env.MODO == 'manha_1030' || env.MODO == 'noite') }}
        continue-on-error: true
        run: |
          if [ "$MODO" = "manha_1030" ]; then
            python src/predictor_1030.py
          else
            python src/validador_19h.py
          fi

      - name: Commit e push de data/
        if: ${{ !cancelled() && env.MODO != 'carga_inicial' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nada novo em data/."
            exit 0
          fi
          git commit -m "robô: $(TZ=America/Sao_Paulo date +%Y-%m-%d) $MODO [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Resultado
        if: ${{ !cancelled() && env.MODO != 'carga_inicial' }}
        run: |
          echo "coleta: ${{ steps.coleta.outcome }} | previsao/validacao: ${{ steps.etapa2.outcome }}"
          [ "${{ steps.coleta.outcome }}" = "success" ] || exit 1
          [ "$MODO" = "manha" ] || [ "${{ steps.etapa2.outcome }}" = "success" ]
